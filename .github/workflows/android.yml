name: Android APK
on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "docs/aris-ai-v1-design", "main", "feature/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle launcher executable
        run: chmod +x gradlew

      - name: Bootstrap and verify Gradle 8.9 wrapper
        run: ./gradlew --version

      - name: Set up Gradle caching and wrapper validation
        uses: gradle/actions/setup-gradle@v5

      - name: Verify official wrapper JAR checksum
        run: |
          echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Aris-Assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
